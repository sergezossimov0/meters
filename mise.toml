# mise config: pinned toolchain + project tasks.
# List tasks: mise tasks        Run one: mise run build
#
# Secrets are NOT stored here. Put them in mise.local.toml (git-excluded):
#   [env]
#   POSTGRES_PASSWORD = "..."
#   JWT_SECRET = "..."
#   KEY = "..."
# or export them in the shell.

[tools]
go = "1.26"
golangci-lint = "2"

[env]
BIN_DIR   = "{{ get_env(name='BIN_DIR', default='bin') }}"
LOG_LEVEL = "{{ get_env(name='LOG_LEVEL', default='info') }}"

# ---------- build ----------

[tasks.build]
description = "Build server and gateway binaries"
run = '''
mkdir -p "$BIN_DIR"
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
LDFLAGS="-X main.version=$VERSION"
go build -ldflags "$LDFLAGS" -o "$BIN_DIR/server" ./cmd/server
go build -ldflags "$LDFLAGS" -o "$BIN_DIR/gateway" ./cmd/gateway
'''

[tasks.clean]
description = "Remove build and coverage artifacts"
run = 'rm -rf "$BIN_DIR"/ coverage.out coverage.html'

# ---------- quality ----------

[tasks.deps]
description = "Download and tidy dependencies"
run = ["go mod download", "go mod tidy"]

[tasks.fmt]
description = "Format code (golangci-lint formatters: gofmt + goimports)"
run = "golangci-lint fmt ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.statictest]
description = "Course static analyzer: go vet -vettool=statictest (downloads it once; rm bin/statictest to update)"
run = '''
set -eu
tool="$BIN_DIR/statictest"
if [ ! -x "$tool" ]; then
  case "$(uname -s)-$(uname -m)" in
    Darwin-arm64)  asset=statictest-darwin-arm64 ;;
    Darwin-x86_64) asset=statictest-darwin-amd64 ;;
    Linux-x86_64)  asset=statictest ;;
    *) echo "statictest: no prebuilt binary for $(uname -s)-$(uname -m)" >&2; exit 1 ;;
  esac
  mkdir -p "$BIN_DIR"
  curl -fsSL -o "$tool" "https://github.com/Yandex-Practicum/go-autotests/releases/latest/download/$asset"
  chmod +x "$tool"
fi
go vet -vettool="$tool" ./...
'''

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.test-race]
description = "Run unit tests with the race detector"
run = "go test -race ./..."

[tasks.test-integration]
description = "Run integration tests (needs Docker for testcontainers)"
run = "go test -race -tags=integration ./..."

[tasks.test-coverage]
description = "Run tests with coverage report"
run = [
  "go test -race -coverprofile=coverage.out ./...",
  "go tool cover -func=coverage.out | tail -1",
  "go tool cover -html=coverage.out -o coverage.html",
]

[tasks.check]
description = "lint + statictest + race tests + build"
run = [{ task = "lint" }, { task = "statictest" }, { task = "test-race" }, { task = "build" }]

# ---------- docker ----------

[tasks.up]
description = "Start PostgreSQL and server in Docker (gateways: COMPOSE_PROFILES=gateways)"
run = "docker compose up -d --build"

[tasks.down]
description = "Stop Docker services, gateways included"
# Profiled services are ignored unless their profile is enabled: without it
# the gateways would keep running and hold the network.
run = "docker compose --profile gateways down"

[tasks.smoke]
description = "Smoke test of the running stand (reads ADMIN_LOGIN, ADMIN_PASSWORD and KEY from .env)"
# .env is loaded inside the task, so its values do not leak into mise's env.
run = '''
set -a; . ./.env; set +a
scripts/smoke.sh
'''

[tasks.gateway-keys]
description = "Register the two compose gateways and print GATEWAY_1_KEY/GATEWAY_2_KEY lines for .env"
run = '''
set -a; . ./.env; set +a
scripts/gateway-keys.sh
'''

[tasks.logs]
description = "Follow the logs of the Docker services (e.g. mise run logs gateway-1)"
run = "docker compose logs -f --tail=50"
