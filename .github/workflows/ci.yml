# Lint, race-enabled unit + integration tests, Docker images.
# Tool versions come from mise.toml, the same as locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: golangci-lint
        run: mise run lint

  # The course's static analyzer (same check as the course template's
  # statictest.yml), latest release of Yandex-Practicum/go-autotests.
  statictest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: Download statictest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo Yandex-Practicum/go-autotests --pattern statictest --dir "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/statictest"
      - name: go vet with statictest
        run: go vet -vettool="$RUNNER_TEMP/statictest" ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: Go caches
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-
      # Unit and integration tests in one run; testcontainers uses the
      # runner's Docker for PostgreSQL.
      - name: Tests (race, integration)
        run: go test -race -tags=integration -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [server, gateway]
    steps:
      - uses: actions/checkout@v5
      - name: Build ${{ matrix.app }} image
        run: docker build --build-arg APP=${{ matrix.app }} --build-arg VERSION=${{ github.sha }} -t meters-${{ matrix.app }}:ci .
